# The root file system is read-only: /etc and /srv are as the image has them, and a rule that would
# make or change something there logs an error at every boot. The command is upstream's, with those
# two paths left out.
[Service]
ExecStart=
ExecStart=systemd-tmpfiles --create --remove --boot --exclude-prefix=/dev --exclude-prefix=/etc --exclude-prefix=/srv
