name: virt-busybox

# The system of the virt-busybox profile, with BusyBox in place of systemd, built and booted in
# QEMU, on the runner and through Docker Compose (ci.yaml).
on:
  workflow_call:
    inputs:
      cold:
        description: Build from scratch, without the cache
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  system:
    uses: ./.github/workflows/system.yaml
    with:
      profile: virt-busybox
      cold: ${{ inputs.cold }}

  docker-system:
    uses: ./.github/workflows/system.yaml
    with:
      profile: virt-busybox
      cold: ${{ inputs.cold }}
      docker: true
