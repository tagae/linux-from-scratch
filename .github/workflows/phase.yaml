name: Phase

# One phase of the build, as the Makefile does it on a Linux host, directly or through Docker
# Compose: of the build tools, which every system shares, or of the system of a profile. Three
# caches hold what it relies on, and what it makes goes back into them whatever happens to the
# build, so that a build too long for one run completes over several: the archives of its key (the
# profile's, or the tools'), the tools' archives, which the phases of a profile only restore, and
# the downloads. The phases before it saved the archives: they only unpack, and the build goes on
# from there.
on:
  workflow_call:
    inputs:
      name:
        description: The phase, which names the cache that it saves
        type: string
        required: true
      profile:
        description: The profile of the system, which the cache and the SBOM are named after; none for the tools
        type: string
        default: ''
      command:
        description: The command that builds the phase
        type: string
        required: true
      cold:
        description: Build from scratch, without the cache of the archives of the key and the downloads
        type: boolean
        default: false
      docker:
        description: The command builds through Docker Compose, whose archives have a cache of their own
        type: boolean
        default: false
      qemu:
        description: The command boots the image in QEMU, which the phase installs a recent release of
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

# The key of the archives that the phase makes: archive/<key>.
env:
  KEY: ${{ inputs.profile || 'tools' }}

jobs:
  phase:
    name: ${{ inputs.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      # `make invalidate` compares HEAD with the commit that the cache was built from.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      # README.md, Requirements: the packages of Dockerfile.bootstrap, and `expect` for `make test`.
      - name: Install the host's packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl wget rsync gawk bison python3 patchelf ca-certificates expect

      # `make test` boots the image in QEMU: the runner's architecture for virt, which has the host's,
      # and ARM for pi0-pgp. virt's command line has `-object monitor-hmp`, new in QEMU 11.1, which
      # Ubuntu's packages lack (8.2 on 24.04, 10.2 on 26.04). Homebrew, which the runner has but
      # leaves off its PATH, has the current release: the Build step puts its QEMU first in PATH.
      # Only the release of the day is known, so the log tells which one ran.
      - name: Install a recent QEMU
        if: ${{ inputs.qemu }}
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_ANALYTICS: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        run: |
          /home/linuxbrew/.linuxbrew/bin/brew install qemu
          for qemu in qemu-system-x86_64 qemu-system-arm qemu-img; do
            /home/linuxbrew/.linuxbrew/opt/qemu/bin/$qemu --version | head -1
          done

      # virt boots with KVM, which the runner has but opens to root alone.
      - name: Open KVM to the build
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || echo "::warning::The runner has no /dev/kvm: virt cannot boot"

      # The archives of a build through Docker Compose record the containers' paths, those of a
      # build on the runner its own: neither can use the other's. The runner's architecture is part
      # of their names, as the tools and the cross toolchains in them run on the build machine. The
      # downloads are the same files for all, checked by hash. No prefix begins another, as a cache
      # is restored by the prefix of its key.
      - name: Name the caches
        id: cache
        env:
          DOCKER: ${{ inputs.docker && 'docker-' || '' }}
        run: |
          echo "archive=${DOCKER}lfs-${KEY}-${RUNNER_ARCH}-" >> "$GITHUB_OUTPUT"
          echo "tools=${DOCKER}lfs-tools-${RUNNER_ARCH}-" >> "$GITHUB_OUTPUT"
          echo "download=lfs-download-" >> "$GITHUB_OUTPUT"

      # Each phase saves its own caches, and restores the most recent ones.
      - name: Restore the archives
        if: ${{ !inputs.cold }}
        uses: actions/cache/restore@v6
        with:
          path: archive/${{ env.KEY }}
          key: ${{ steps.cache.outputs.archive }}${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.name }}
          restore-keys: ${{ steps.cache.outputs.archive }}

      # A system's phases build on the tools whatever `cold` says: the jobs that made them ran
      # before, in this run. A phase never saves them.
      - name: Restore the tools' archives
        if: ${{ inputs.profile != '' }}
        uses: actions/cache/restore@v6
        with:
          path: archive/tools
          key: ${{ steps.cache.outputs.tools }}${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.name }}
          restore-keys: ${{ steps.cache.outputs.tools }}

      - name: Restore the downloads
        if: ${{ !inputs.cold }}
        uses: actions/cache/restore@v6
        with:
          path: download
          key: ${{ steps.cache.outputs.download }}${{ github.run_id }}-${{ github.run_attempt }}-${{ env.KEY }}-${{ inputs.name }}
          restore-keys: ${{ steps.cache.outputs.download }}

      - name: Drop the stale archives
        run: make ${{ inputs.docker && 'docker-' || '' }}invalidate

      # The files that the caches of the phase hold, by name, size and modification time, to tell
      # afterwards whether the build changed them: an archive rebuilt under the same name and size
      # has a new time. Not a .commit, which `make invalidate` has just written, nor an archive
      # that is still being made.
      - name: Fingerprint the caches
        id: before
        run: |
          mkdir -p "archive/$KEY" download
          fingerprint() {
            find "$1" -type f ! -name .commit ! -name '*.tmp' -printf '%p %s %T@\n' | LC_ALL=C sort | sha256sum
          }
          echo "archive=$(fingerprint "archive/$KEY")" >> "$GITHUB_OUTPUT"
          echo "download=$(fingerprint download)" >> "$GITHUB_OUTPUT"

      # The build has its own timeout, so that the steps that save the cache get to run before the
      # job's. pi0-pgp boots in QEMU's emulation of the raspi0 machine, slower than on a Pi.
      - name: Build
        timeout-minutes: 330
        env:
          COMMAND: ${{ inputs.command }}
          TEST_TIMEOUT: 600
          # The host's tools, as a container has them, rather than the runner's own, which sit in
          # /usr/local, /opt and the home directory; but for QEMU, if the phase boots an image.
          PATH: ${{ inputs.qemu && '/home/linuxbrew/.linuxbrew/opt/qemu/bin:' || '' }}/usr/sbin:/usr/bin:/sbin:/bin
        run: eval "$COMMAND"

      # The SBOM of an image, of a phase that makes one, must be valid SPDX: the scan reads it. The
      # image and its SBOM are made before the test boots the image, so a failed boot leaves them,
      # and both steps below run whatever the build's result.
      - name: Validate the SBOM
        if: ${{ !cancelled() && hashFiles('image/*.spdx.json') != '' }}
        run: make sbom-check

      # The SBOM of the image, of a phase that makes one, and the files that its kernel was built
      # from, for the vulnerability scan (vulnerabilities.yaml).
      - name: Keep the SBOM
        if: ${{ !cancelled() && hashFiles('image/*.spdx.json') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: sbom-${{ inputs.profile }}-${{ inputs.name }}
          path: |
            image/*.spdx.json
            image/*.kernel-files
          retention-days: 90

      - name: Report disk usage
        if: always()
        run: |
          df -h /
          du -sh archive download tools work source install image || true

      - name: Check whether the build changed the caches
        id: after
        if: always()
        env:
          ARCHIVE: ${{ steps.before.outputs.archive }}
          DOWNLOAD: ${{ steps.before.outputs.download }}
        run: |
          changed() {
            [ "$(find "$1" -type f ! -name .commit ! -name '*.tmp' -printf '%p %s %T@\n' | LC_ALL=C sort | sha256sum)" != "$2" ]
          }
          archive=false download=false
          # Without the fingerprints of before the build, the build never started.
          if [ -n "$ARCHIVE" ]; then
            # An archive that the build was making when it stopped is not worth the cache's space.
            find archive -name '*.tmp' -delete
            if changed "archive/$KEY" "$ARCHIVE"; then archive=true; fi
            if changed download "$DOWNLOAD"; then download=true; fi
          fi
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "download=$download" >> "$GITHUB_OUTPUT"

      # Only main saves, so that a cache always has a commit of main behind it.
      - name: Save the archives
        if: ${{ always() && github.ref == 'refs/heads/main' && steps.after.outputs.archive == 'true' }}
        uses: actions/cache/save@v6
        with:
          path: archive/${{ env.KEY }}
          key: ${{ steps.cache.outputs.archive }}${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.name }}

      - name: Save the downloads
        if: ${{ always() && github.ref == 'refs/heads/main' && steps.after.outputs.download == 'true' }}
        uses: actions/cache/save@v6
        with:
          path: download
          key: ${{ steps.cache.outputs.download }}${{ github.run_id }}-${{ github.run_attempt }}-${{ env.KEY }}-${{ inputs.name }}
