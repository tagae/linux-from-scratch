name: System

# The system of a platform, built and booted in QEMU as `make <platform>-test` does, one job per
# phase because a job has six hours and a cold build takes longer. Each phase relies on the archives
# that the one before it saved in the cache, so only the first can start from scratch. The
# Makefile's targets set SYSTEM_KEY and export LFS_RELEASE, which the system files bake into
# os-release; the phases that a target runs before its own only unpack their archives.
on:
  workflow_call:
    inputs:
      platform:
        description: The platform of the system, as the Makefile's targets name it
        type: string
        required: true
      cold:
        description: Build from scratch, without the cache
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  bootstrap:
    uses: ./.github/workflows/phase.yaml
    with:
      name: bootstrap
      platform: ${{ inputs.platform }}
      command: make ${{ inputs.platform }}-tools-bootstrap
      cold: ${{ inputs.cold }}

  tools:
    needs: bootstrap
    uses: ./.github/workflows/phase.yaml
    with:
      name: tools
      platform: ${{ inputs.platform }}
      command: make ${{ inputs.platform }}-tools

  system:
    needs: tools
    uses: ./.github/workflows/phase.yaml
    with:
      name: system
      platform: ${{ inputs.platform }}
      command: make ${{ inputs.platform }}-system

  test:
    needs: system
    uses: ./.github/workflows/phase.yaml
    with:
      name: test
      platform: ${{ inputs.platform }}
      command: make ${{ inputs.platform }}-test

  # The same phases through Docker Compose, as on a Mac: the bootstrap container builds the first
  # tools, the scratch container, which holds nothing but the tools, the rest, and the image boots on
  # the runner. Their archives are cached apart from those above.
  docker-bootstrap:
    uses: ./.github/workflows/phase.yaml
    with:
      name: docker-bootstrap
      platform: ${{ inputs.platform }}
      command: make docker-${{ inputs.platform }}-tools-bootstrap
      cold: ${{ inputs.cold }}
      docker: true

  docker-tools:
    needs: docker-bootstrap
    uses: ./.github/workflows/phase.yaml
    with:
      name: docker-tools
      platform: ${{ inputs.platform }}
      command: make docker-${{ inputs.platform }}-tools
      docker: true

  docker-system:
    needs: docker-tools
    uses: ./.github/workflows/phase.yaml
    with:
      name: docker-system
      platform: ${{ inputs.platform }}
      command: make docker-${{ inputs.platform }}-system
      docker: true

  docker-test:
    needs: docker-system
    uses: ./.github/workflows/phase.yaml
    with:
      name: docker-test
      platform: ${{ inputs.platform }}
      command: make docker-${{ inputs.platform }}-test
      docker: true
