name: System

# The system of a profile, built and booted in QEMU as `make <profile>-test` does, one job per
# phase because a job has six hours and a cold build takes longer. Each phase relies on the archives
# that the one before it saved in the cache, so only the first can start from scratch. The
# Makefile's targets set PROFILE, and the release and the revision that the image records in
# os-release (LFS_RELEASE, from the tags and commits). The build tools come first, from jobs that
# the caller runs before this workflow (ci.yaml), as they are the same for every profile: a phase
# of the system only unpacks their archives.
on:
  workflow_call:
    inputs:
      profile:
        description: The profile of the system, as the Makefile's targets name it
        type: string
        required: true
      cold:
        description: Build from scratch, without the cache
        type: boolean
        default: false
      docker:
        description: Build through Docker Compose, as on a Mac, rather than on the runner
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # Through Docker Compose, the scratch container, which holds nothing but the tools, builds the
  # system, and the image boots on the runner. The archives of the two ways of building are cached
  # apart.
  system:
    uses: ./.github/workflows/phase.yaml
    with:
      name: ${{ inputs.docker && 'docker-system' || 'system' }}
      profile: ${{ inputs.profile }}
      command: make ${{ inputs.docker && 'docker-' || '' }}${{ inputs.profile }}-system
      cold: ${{ inputs.cold }}
      docker: ${{ inputs.docker }}

  test:
    needs: system
    uses: ./.github/workflows/phase.yaml
    with:
      name: ${{ inputs.docker && 'docker-test' || 'test' }}
      profile: ${{ inputs.profile }}
      command: make ${{ inputs.docker && 'docker-' || '' }}${{ inputs.profile }}-test
      docker: ${{ inputs.docker }}
      qemu: true
