name: System

# The system of a profile, built and booted in QEMU as `make <profile>-test` does, one job per
# phase because a job has six hours and a cold build takes longer. Each phase relies on the archives
# that the one before it saved in the cache, so only the first can start from scratch. The
# Makefile's targets set PROFILE and export LFS_RELEASE, which the system files bake into
# os-release; the phases that a target runs before its own only unpack their archives. The tools
# are those of every profile, and their phases name none.
on:
  workflow_call:
    inputs:
      profile:
        description: The profile of the system, as the Makefile's targets name it
        type: string
        required: true
      cold:
        description: Build from scratch, without the cache
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  bootstrap:
    uses: ./.github/workflows/phase.yaml
    with:
      name: bootstrap
      profile: ${{ inputs.profile }}
      command: make tools-bootstrap
      cold: ${{ inputs.cold }}

  tools:
    needs: bootstrap
    uses: ./.github/workflows/phase.yaml
    with:
      name: tools
      profile: ${{ inputs.profile }}
      command: make tools

  system:
    needs: tools
    uses: ./.github/workflows/phase.yaml
    with:
      name: system
      profile: ${{ inputs.profile }}
      command: make ${{ inputs.profile }}-system

  test:
    needs: system
    uses: ./.github/workflows/phase.yaml
    with:
      name: test
      profile: ${{ inputs.profile }}
      command: make ${{ inputs.profile }}-test

  # The same phases through Docker Compose, as on a Mac: the bootstrap container builds the first
  # tools, the scratch container, which holds nothing but the tools, the rest, and the image boots on
  # the runner. Their archives are cached apart from those above.
  docker-bootstrap:
    uses: ./.github/workflows/phase.yaml
    with:
      name: docker-bootstrap
      profile: ${{ inputs.profile }}
      command: make docker-tools-bootstrap
      cold: ${{ inputs.cold }}
      docker: true

  docker-tools:
    needs: docker-bootstrap
    uses: ./.github/workflows/phase.yaml
    with:
      name: docker-tools
      profile: ${{ inputs.profile }}
      command: make docker-tools
      docker: true

  docker-system:
    needs: docker-tools
    uses: ./.github/workflows/phase.yaml
    with:
      name: docker-system
      profile: ${{ inputs.profile }}
      command: make docker-${{ inputs.profile }}-system
      docker: true

  docker-test:
    needs: docker-system
    uses: ./.github/workflows/phase.yaml
    with:
      name: docker-test
      profile: ${{ inputs.profile }}
      command: make docker-${{ inputs.profile }}-test
      docker: true
