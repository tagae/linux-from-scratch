name: pi0-pgp

# The system of the pi0-pgp profile, the one that runs on hardware, built and booted in QEMU, on
# the runner and through Docker Compose. It starts when the Tools workflow ends successfully, for
# the commit that workflow ran on, so that it only unpacks the archives of the build tools. The
# systems of the other profiles are built apart, so that a failure in one leaves the others to
# finish. The profiles are also in check/lint and .github/workflows/vulnerabilities.yaml.
on:
  workflow_run:
    workflows: [Tools]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      cold:
        description: Build from scratch, without the cache
        type: boolean
        default: false

permissions:
  contents: read

# Runs queue rather than cancel one another: a cancelled build loses its archives.
concurrency:
  group: pi0-pgp
  cancel-in-progress: false

jobs:
  system:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    uses: ./.github/workflows/system.yaml
    with:
      profile: pi0-pgp
      cold: ${{ inputs.cold == true }}

  docker-system:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    uses: ./.github/workflows/system.yaml
    with:
      profile: pi0-pgp
      cold: ${{ inputs.cold == true }}
      docker: true
