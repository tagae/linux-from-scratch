name: pi0-pgp

# The system of the pi0-pgp profile, the one that runs on hardware, built and booted in QEMU, on
# the runner and through Docker Compose. CI (ci.yaml) calls it once the build tools are built
# (tools.yaml), so that it only unpacks their archives.
on:
  workflow_call:
    inputs:
      cold:
        description: Build from scratch, without the cache
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  system:
    uses: ./.github/workflows/system.yaml
    with:
      profile: pi0-pgp
      cold: ${{ inputs.cold }}

  docker-system:
    uses: ./.github/workflows/system.yaml
    with:
      profile: pi0-pgp
      cold: ${{ inputs.cold }}
      docker: true
