name: pi0-pgp

# The system of the pi0-pgp profile, the one that runs on hardware, built and booted in QEMU, on
# the runner and through Docker Compose (ci.yaml).
on:
  workflow_call:
    inputs:
      cold:
        description: Build from scratch, without the cache
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  system:
    uses: ./.github/workflows/system.yaml
    with:
      profile: pi0-pgp
      cold: ${{ inputs.cold }}

  docker-system:
    uses: ./.github/workflows/system.yaml
    with:
      profile: pi0-pgp
      cold: ${{ inputs.cold }}
      docker: true
