name: Vulnerability scan

# The vulnerabilities of the images that CI builds, one per profile, as Grype finds them from each
# image's SBOM, with the latest vulnerability data, after each run of CI on main. Every finding
# goes to the run's summary and to GitHub's code scanning, and the run fails, as its badge shows,
# when a finding of high or critical severity has a fixed version, in any image. The findings that
# do not concern the images are left out by check/grype.yaml. `make vulnerability-check` does
# the scan, here and locally. Nothing is built, and CI's own result is left alone. The profiles are
# those of .github/workflows/ci.yaml.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  scan:
    name: scan (${{ matrix.profile }})
    strategy:
      # An image with a finding does not stop the scan of the others.
      fail-fast: false
      matrix:
        profile: [virt, pi0-pgp]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The SBOM of the last image of the profile that CI made on main, which is an earlier run's
      # when the run that ended stopped before the image.
      - name: Fetch the SBOM
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          artifact=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=sbom-${{ matrix.profile }}-test&per_page=50" \
            --jq '[.artifacts[] | select(.expired | not) | select(.workflow_run.head_branch == "main")]
              | sort_by(.created_at) | last | .id // empty')
          if [ -z "$artifact" ]; then
            echo "::error::No SBOM of a ${{ matrix.profile }} image of CI on main"
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact/zip" > sbom.zip
          mkdir image
          unzip -q sbom.zip -d image
          ls image

      # `make vulnerability-check` is what a developer runs: it fails on a finding of high or
      # critical severity that a newer version fixes, after the findings are written for the steps
      # below, which run whatever its result.
      - name: Scan
        run: make vulnerability-check

      - name: Summarize the findings
        if: ${{ !cancelled() }}
        run: cat work/check/vulnerabilities/*.md >> "$GITHUB_STEP_SUMMARY"

      - name: Send the findings to code scanning
        if: ${{ !cancelled() && hashFiles('work/check/vulnerabilities/*.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: work/check/vulnerabilities
          category: grype-${{ matrix.profile }}

      # The findings of the kernel that the scan leaves out, and why.
      - name: Keep the VEX document
        if: ${{ !cancelled() && hashFiles('work/check/vulnerabilities/*.openvex.json') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: openvex-${{ matrix.profile }}
          path: work/check/vulnerabilities/*.openvex.json
          retention-days: 90
