name: Vulnerability scan

# The vulnerabilities of the images that CI builds, one per platform, as Grype finds them from each
# image's SBOM, with the latest vulnerability data, after each run of CI on main. Every finding
# goes to the run's summary and to GitHub's code scanning, and the run fails, as its badge shows,
# when a finding of high or critical severity has a fixed version, in any image. The findings that
# do not concern the images are left out by .github/ci/grype.yaml. Nothing is built, and CI's own
# result is left alone. The platforms are those of .github/workflows/ci.yaml.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  GRYPE_VERSION: 0.121.0
  GRYPE_SHA256: 64e07133d3486115de647a66581461dccf5c732748a0a3119077395565f15519
  # The findings that fail the run.
  URGENT: >-
    .matches[] | select(.vulnerability.fix.state == "fixed"
      and (.vulnerability.severity == "High" or .vulnerability.severity == "Critical"))

jobs:
  scan:
    name: scan (${{ matrix.platform }})
    strategy:
      # An image with a finding does not stop the scan of the others.
      fail-fast: false
      matrix:
        platform: [virt, pi0]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The SBOM of the last image of the platform that CI made on main, which is an earlier run's
      # when the run that ended stopped before the image.
      - name: Fetch the SBOM
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          artifact=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=sbom-${{ matrix.platform }}-test&per_page=50" \
            --jq '[.artifacts[] | select(.expired | not) | select(.workflow_run.head_branch == "main")]
              | sort_by(.created_at) | last | .id // empty')
          if [ -z "$artifact" ]; then
            echo "::error::No SBOM of a ${{ matrix.platform }} image of CI on main"
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact/zip" > sbom.zip
          mkdir sbom
          unzip -q sbom.zip -d sbom
          ls sbom

      - name: Install Grype
        run: |
          curl -sSfLo grype.tar.gz \
            "https://github.com/anchore/grype/releases/download/v$GRYPE_VERSION/grype_${GRYPE_VERSION}_linux_amd64.tar.gz"
          echo "$GRYPE_SHA256  grype.tar.gz" | sha256sum -c
          tar -xzf grype.tar.gz grype

      # Grype gives the findings of an SBOM no file, which code scanning requires: they are given
      # the SBOM's, as the image build writes it.
      - name: Scan
        run: |
          ./grype db update
          sbom=$(echo sbom/*.spdx.json)
          ./grype --config .github/ci/grype.yaml -o json=grype.json -o sarif=grype.sarif "sbom:$sbom"
          jq --arg uri "image/${sbom#sbom/}" \
            '(.runs[].results[]?.locations[]?.physicalLocation.artifactLocation.uri)
              |= (if (. // "") == "" then $uri else . end)' grype.sarif > grype-located.sarif
          {
            echo "## $(basename "$sbom" .spdx.json)"
            echo
            echo "$(jq '.matches | length' grype.json) findings in" \
              "$(jq '[.matches[].artifact.name] | unique | length' grype.json) packages," \
              "$(jq "[$URGENT] | length" grype.json) of high or critical severity with a fixed version."
            echo
            echo "| Package | Findings | With a fixed version |"
            echo "|---|---|---|"
            jq -r '.matches | group_by(.artifact.name + " " + .artifact.version)[]
              | "| \(.[0].artifact.name) \(.[0].artifact.version) | \(length) | \(map(select(.vulnerability.fix.state == "fixed")) | length) |"' grype.json
            echo
            echo "### High or critical, with a fixed version"
            echo
            echo "| Package | Vulnerability | Severity | Fixed in |"
            echo "|---|---|---|---|"
            jq -r "$URGENT"' | "| \(.artifact.name) \(.artifact.version) | \(.vulnerability.id) | \(.vulnerability.severity) | \(.vulnerability.fix.versions | join(", ")) |"' grype.json
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Send the findings to code scanning
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: grype-located.sarif
          category: grype-${{ matrix.platform }}

      - name: Fail on a fixed vulnerability of high or critical severity
        run: |
          count=$(jq "[$URGENT] | length" grype.json)
          if [ "$count" -gt 0 ]; then
            echo "::error::$count findings of high or critical severity have a fixed version"
            exit 1
          fi
