name: virt

# The system of the virt profile, the Makefile's default, built and booted in QEMU, on the runner
# and through Docker Compose (ci.yaml).
on:
  workflow_call:
    inputs:
      cold:
        description: Build from scratch, without the cache
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  system:
    uses: ./.github/workflows/system.yaml
    with:
      profile: virt
      cold: ${{ inputs.cold }}

  docker-system:
    uses: ./.github/workflows/system.yaml
    with:
      profile: virt
      cold: ${{ inputs.cold }}
      docker: true
