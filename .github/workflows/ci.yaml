name: CI

# A push that changes nothing but documentation builds nothing.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.claude/**'
      - LICENSE
  workflow_dispatch:
    inputs:
      cold:
        description: Build from scratch, without the cache
        type: boolean
        default: false

permissions:
  contents: read

# Runs queue rather than cancel one another: a cancelled build loses its archives. The group is
# the workflow's, not a job's, as a job in the same group would wait for the run that holds it.
concurrency:
  group: pi0
  cancel-in-progress: false

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Lint
        run: .github/ci/lint

  # The pi0 system, built and booted in QEMU as `make pi0-test` does, one job per phase because a
  # job has six hours and a cold build takes longer. Each phase relies on the archives that the
  # one before it saved in the cache, so only the first can start from scratch. The Makefile's
  # targets set SYSTEM_KEY and export LFS_RELEASE, which the system files bake into os-release;
  # the phases that a target runs before its own only unpack their archives.
  bootstrap:
    uses: ./.github/workflows/pi0-phase.yaml
    with:
      name: bootstrap
      command: make pi0-tools-bootstrap
      cold: ${{ inputs.cold == true }}

  tools:
    needs: bootstrap
    uses: ./.github/workflows/pi0-phase.yaml
    with:
      name: tools
      command: make pi0-tools

  system:
    needs: tools
    uses: ./.github/workflows/pi0-phase.yaml
    with:
      name: system
      command: make pi0-system

  test:
    needs: system
    uses: ./.github/workflows/pi0-phase.yaml
    with:
      name: test
      command: make pi0-test

  # The same phases through Docker Compose, as on a Mac: the bootstrap container builds the first
  # tools, the scratch container, which holds nothing but the tools, the rest, and the image boots on
  # the runner. Their archives are cached apart from those above.
  docker-bootstrap:
    uses: ./.github/workflows/pi0-phase.yaml
    with:
      name: docker-bootstrap
      command: make docker-pi0-tools-bootstrap
      cold: ${{ inputs.cold == true }}
      docker: true

  docker-tools:
    needs: docker-bootstrap
    uses: ./.github/workflows/pi0-phase.yaml
    with:
      name: docker-tools
      command: make docker-pi0-tools
      docker: true

  docker-system:
    needs: docker-tools
    uses: ./.github/workflows/pi0-phase.yaml
    with:
      name: docker-system
      command: make docker-pi0-system
      docker: true

  docker-test:
    needs: docker-system
    uses: ./.github/workflows/pi0-phase.yaml
    with:
      name: docker-test
      command: make docker-pi0-test
      docker: true
