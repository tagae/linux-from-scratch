name: CI

# Everything that CI builds and boots for a commit: the sources and the build tools (tools.yaml),
# which every system shares, then the system of each profile, built and booted in QEMU
# (<profile>.yaml), which only unpacks the tools' archives. It is one run, so that GitHub holds the
# commit as pending until its last job ends: a workflow that another starts when it ends
# (`workflow_run`) shows its checks only once it has started, and the commit reads as passed until
# then. Each profile is a job of its own, so that a failure in one leaves the others to finish; the
# profiles are also in check/lint and vulnerabilities.yaml. A push that changes nothing but
# documentation builds nothing.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.claude/**'
      - LICENSE
  workflow_dispatch:
    inputs:
      cold:
        description: Build from scratch, without the cache
        type: boolean
        default: false

permissions:
  contents: read

# Runs queue rather than cancel one another: a cancelled build loses its archives.
concurrency:
  group: ci
  cancel-in-progress: false

jobs:
  tools:
    uses: ./.github/workflows/tools.yaml
    with:
      cold: ${{ inputs.cold == true }}

  virt:
    needs: tools
    uses: ./.github/workflows/virt.yaml
    with:
      cold: ${{ inputs.cold == true }}

  pi0-pgp:
    needs: tools
    uses: ./.github/workflows/pi0-pgp.yaml
    with:
      cold: ${{ inputs.cold == true }}

  virt-busybox:
    needs: tools
    uses: ./.github/workflows/virt-busybox.yaml
    with:
      cold: ${{ inputs.cold == true }}
