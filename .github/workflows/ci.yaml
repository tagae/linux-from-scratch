name: CI

# A push that changes nothing but documentation builds nothing.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.claude/**'
      - LICENSE
  workflow_dispatch:
    inputs:
      cold:
        description: Build from scratch, without the cache
        type: boolean
        default: false

permissions:
  contents: read

# Runs queue rather than cancel one another: a cancelled build loses its archives. The group is
# the workflow's, not a job's, as a job in the same group would wait for the run that holds it.
concurrency:
  group: build
  cancel-in-progress: false

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Lint
        run: .github/ci/lint

  # The systems that CI builds and boots, one per platform: virt, the platform that the Makefile
  # builds by default, and pi0, the one that runs on hardware. Each system is built apart from the
  # other, so that a failure in one leaves the other to finish. The platforms are also in
  # .github/ci/lint and .github/workflows/vulnerabilities.yaml.
  virt:
    uses: ./.github/workflows/system.yaml
    with:
      platform: virt
      cold: ${{ inputs.cold == true }}

  pi0:
    uses: ./.github/workflows/system.yaml
    with:
      platform: pi0
      cold: ${{ inputs.cold == true }}
