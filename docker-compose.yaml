services:
  bootstrap:
    build:
      dockerfile: Dockerfile.bootstrap
      args:
        HOST_UID:
        HOST_GID:
    environment:
      PLATFORM:
      CAPS:
      SYSTEM_KEY:
    volumes:
      - type: bind
        source: lfs
        target: /mnt/lfs/lfs
      - type: bind
        source: lib
        target: /mnt/lfs/lib
      - type: bind
        source: package
        target: /mnt/lfs/package
      - type: bind
        source: $PWD/download
        target: /mnt/lfs/download
      - type: volume
        source: source
        target: /mnt/lfs/source
      - type: volume
        source: work
        target: /mnt/lfs/work
      - type: volume
        source: tools
        target: /mnt/lfs/tools
      # Unused here, but a volume created by this service takes the ownership of the mount point in
      # its image, which the scratch image cannot provide.
      - type: volume
        source: install
        target: /mnt/lfs/install
      - type: bind # So that built archives can be consumed where needed outside the container.
        source: $PWD/archive
        target: /mnt/lfs/archive
      - type: bind # Holds artefacts Dockerfile.scratch needs to COPY at image build time.
        source: $PWD/work/bootstrap
        target: /mnt/lfs/work/bootstrap

  scratch:
    build:
      dockerfile: Dockerfile.scratch
      args:
        HOST_UID:
        HOST_GID:
    privileged: true
    environment:
      PLATFORM:
      CAPS:
      SYSTEM_KEY:
      ERASE:
      TIMEZONE:
      INSTALL_DIR:
      IMAGE_SIZE:
      LFS_RELEASE:
      VERSION_CODENAME:
      RELEASE_TYPE:
      DISTRIB_CODENAME:
      DISTRIB_DESCRIPTION:
    volumes:
      - type: bind
        source: lfs
        target: /mnt/lfs/lfs
      - type: bind
        source: lib
        target: /mnt/lfs/lib
      - type: bind
        source: package
        target: /mnt/lfs/package
      - type: bind
        source: $PWD/download
        target: /mnt/lfs/download
      - type: volume
        source: source
        target: /mnt/lfs/source
      - type: volume
        source: work
        target: /mnt/lfs/work
      - type: bind # So that the kernel lands on the host for consumption by QEMU.
        source: $PWD/work/boot
        target: /mnt/lfs/work/boot
      - type: volume
        source: tools
        target: /mnt/lfs/tools
      - type: volume
        source: install
        target: /mnt/lfs/install
      - type: bind # So that built images are available on the host (e.g., for QEMU to run).
        source: $PWD/image
        target: /mnt/lfs/image
      - type: bind # So that built archives can be consumed where needed outside the container.
        source: $PWD/archive
        target: /mnt/lfs/archive

  dev:
    build:
      dockerfile: Dockerfile.dev
      args:
        HOST_UID:
        HOST_GID:
    tty: true
    stdin_open: true
    privileged: true
    volumes:
      - type: bind
        source: .
        target: /mnt/lfs
      - type: volume
        source: source
        target: /mnt/lfs/source
      - type: volume
        source: work
        target: /mnt/lfs/work
      # The work volume holds a root-owned mount point for this when the scratch service ran first,
      # which the lfs user could not write the kernel to.
      - type: bind
        source: $PWD/work/boot
        target: /mnt/lfs/work/boot
      - type: volume
        source: tools
        target: /mnt/lfs/tools
      - type: volume
        source: install
        target: /mnt/lfs/install

volumes:
  source:
  work:
  tools:
  install:
