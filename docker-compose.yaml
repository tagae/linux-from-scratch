services:
  bootstrap:
    build:
      dockerfile: Dockerfile.bootstrap-debian
      args:
        HOST_UID: $HOST_UID
        HOST_GID: $HOST_GID
    tty: true
    stdin_open: true
    privileged: true
    environment:
      PLATFORM:
    volumes: &volumes;
      - type: bind
        source: lfs
        target: /var/lfs/lfs
      - type: bind
        source: lib
        target: /var/lfs/lib
      - type: bind
        source: package
        target: /var/lfs/package
      - type: bind
        source: $PWD/download
        target: /var/lfs/download
      - type: volume
        source: source
        target: /var/lfs/source
      - type: volume
        source: work
        target: /var/lfs/work
      - type: volume
        source: tools
        target: /var/lfs/tools
      - type: volume
        source: install
        target: /var/lfs/install

  scratch:
    build:
      dockerfile: Dockerfile.scratch
    tty: true
    stdin_open: true
    privileged: true
    environment:
      PLATFORM:
    volumes: *volumes;

volumes:
  source:
  work:
  tools:
  install:
