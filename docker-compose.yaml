services:
  alpine:
    build:
      dockerfile: Dockerfile.alpine
      args:
        HOST_UID: $HOST_UID
        HOST_GID: $HOST_GID
    stdin_open: true
    tty: true
    privileged: true
    environment:
      PLATFORM: ${PLATFORM:-pi0}
      DESTINATION:
    volumes:
      - type: volume
        source: download
        target: /var/lfs/download
      - type: volume
        source: image
        target: /var/lfs/image
      - type: volume
        source: source
        target: /var/lfs/source
      - type: volume
        source: work
        target: /var/lfs/work
      - type: volume
        source: tools
        target: /var/lfs/tools
      - type: volume
        source: install
        target: /var/lfs/install
volumes:
  download:
  image:
  source:
  work:
  tools:
  install:
