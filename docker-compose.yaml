# usage: UID=$(id -u) GID=$(id -g) docker compose run --build --rm -ti lfs ./lfs

services:
  lfs:
    build:
      dockerfile: Dockerfile.debian
    volumes:
      - type: bind
        source: $PWD/download
        target: /var/lfs/download
      - type: bind
        source: $PWD/image
        target: /var/lfs/image
      - type: volume
        source: source
        target: /var/lfs/source
      - type: volume
        source: work
        target: /var/lfs/work
      - type: volume
        source: tools
        target: /var/lfs/tools
      - type: volume
        source: install
        target: /var/lfs/install

    #  - type: bind
    #    source: $PWD
    #    target: /var/lfs
    working_dir: /var/lfs
    #privileged: true
    #user: $UID:$GID

  lfs-alpine:
    build:
      dockerfile: Dockerfile.alpine
    volumes:
      - type: bind
        source: $PWD/download
        target: /var/lfs/download
      - type: bind
        source: $PWD/image
        target: /var/lfs/image
      - type: volume
        source: source
        target: /var/lfs/source
      - type: volume
        source: work
        target: /var/lfs/work
      - type: volume
        source: tools
        target: /var/lfs/tools
      - type: volume
        source: install
        target: /var/lfs/install
      - type: bind
        source: lib
        target: /var/lfs/lib
      - type: bind
        source: package
        target: /var/lfs/package
      - type: bind
        source: lfs
        target: /var/lfs/lfs

    working_dir: /var/lfs
    privileged: true

volumes:
  source:
  work:
  tools:
  install:
