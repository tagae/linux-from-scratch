services:
  bootstrap:
    build:
      dockerfile: Dockerfile.bootstrap
      args:
        HOST_UID:
        HOST_GID:
    tty: true
    stdin_open: true
    privileged: true
    environment:
      SYSTEM_KEY:
    volumes:
      - type: bind
        source: lfs
        target: /mnt/lfs/lfs
      - type: bind
        source: lib
        target: /mnt/lfs/lib
      - type: bind
        source: package
        target: /mnt/lfs/package
      - type: bind
        source: $PWD/download
        target: /mnt/lfs/download
      - type: volume
        source: source
        target: /mnt/lfs/source
      - type: volume
        source: work
        target: /mnt/lfs/work
      - type: volume
        source: tools
        target: /mnt/lfs/tools
      - type: bind # So that built archives can be consumed where needed outside the container.
        source: $PWD/archive
        target: /mnt/lfs/archive
      - type: bind # Holds artefacts Dockerfile.scratch needs to COPY at image build time.
        source: $PWD/work/bootstrap
        target: /mnt/lfs/work/bootstrap

  scratch:
    build:
      dockerfile: Dockerfile.scratch
      args:
        HOST_UID:
        HOST_GID:
    tty: true
    stdin_open: true
    privileged: true
    environment:
      SYSTEM_KEY:
      INSTALL_DIR:
      IMAGE_SIZE:
      LFS_RELEASE:
      VERSION_CODENAME:
      RELEASE_TYPE:
      DISTRIB_RELEASE:
      DISTRIB_CODENAME:
      DISTRIB_DESCRIPTION:
    volumes:
      - type: bind
        source: lfs
        target: /mnt/lfs/lfs
      - type: bind
        source: lib
        target: /mnt/lfs/lib
      - type: bind
        source: package
        target: /mnt/lfs/package
      - type: bind
        source: $PWD/download
        target: /mnt/lfs/download
      - type: volume
        source: source
        target: /mnt/lfs/source
      - type: volume
        source: work
        target: /mnt/lfs/work
      - type: bind # So that the kernel lands on the host for consumption by QEMU.
        source: $PWD/work/boot
        target: /mnt/lfs/work/boot
      - type: volume
        source: tools
        target: /mnt/lfs/tools
      # Avoids baking a /lib symlink into the image, which isn't possible since the `scratch` base
      # image cannot execute anything (not even `ln`) prior to mounting TOOL_DIR.
      - type: volume
        source: tools
        target: /lib
        read_only: true
        volume:
          subpath: usr/lib
      # Avoids baking a /usr/lib symlink into the image, which isn't possible since the `scratch`
      # base image cannot execute anything (not even `ln`) prior to mounting TOOL_DIR.
      - type: volume
        source: tools
        target: /usr/lib
        read_only: true
        volume:
          subpath: usr/lib
      # Enables resolution of the #!/usr/bin/env shebang.
      - type: volume
        source: tools
        target: /usr/bin
        read_only: true
        volume:
          subpath: usr/bin
      # The from-scratch CA trust store built by bootstrap, at openssl's default location.
      - type: volume
        source: tools
        target: /etc/ssl
        read_only: true
        volume:
          subpath: etc/ssl
      # Docker seeds a freshly created named volume with whatever content
      # (and ownership) already exists at that path in the image. Dockerfile
      # .scratch bakes /mnt/lfs/install pre-owned by the lfs user directly
      # into its own layer via COPY --chown, so this mount only needs to
      # exist here —no other service needs to touch it first.
      - type: volume
        source: install
        target: /mnt/lfs/install
      - type: bind # So that built images are available on the host (e.g., for QEMU to run).
        source: $PWD/image
        target: /mnt/lfs/image
      - type: bind # So that built archives can be consumed where needed outside the container.
        source: $PWD/archive
        target: /mnt/lfs/archive

volumes:
  source:
  work:
  tools:
  install:
