services:
  bootstrap:
    build:
      dockerfile: Dockerfile.bootstrap-debian
      args:
        HOST_UID: $HOST_UID
        HOST_GID: $HOST_GID
    tty: true
    stdin_open: true
    privileged: true
    environment:
      PLATFORM:
    volumes:
      - type: bind
        source: lfs
        target: /mnt/lfs/lfs
      - type: bind
        source: lib
        target: /mnt/lfs/lib
      - type: bind
        source: package
        target: /mnt/lfs/package
      - type: bind
        source: $PWD/download
        target: /mnt/lfs/download
      - type: volume
        source: source
        target: /mnt/lfs/source
      - type: volume
        source: work
        target: /mnt/lfs/work
      - type: volume
        source: tools
        target: /mnt/lfs/tools
      # Bind mount: Dockerfile.scratch needs to COPY our own already-built
      # bash out of here at image build time. TOOL_DIR itself stays a named
      # volume (not visible to `docker build` at all); tools_bootstrap
      # stages just this one file here instead.
      - type: bind
        source: $PWD/work/scratch-init
        target: /mnt/lfs/work/scratch-init
      # bootstrap never writes here itself, but its presence matters: this
      # is what makes Docker initialize the (root-owned by default) install
      # volume with the correct lfs ownership the first time it's used —
      # Dockerfile.scratch (FROM scratch) has no chown mechanism at all, so
      # if scratch is the first to touch this mount, it stays root-owned
      # and the non-root scratch container can't fix that itself.
      - type: volume
        source: install
        target: /mnt/lfs/install

  scratch:
    build:
      dockerfile: Dockerfile.scratch
      args:
        HOST_UID: $HOST_UID
        HOST_GID: $HOST_GID
    tty: true
    stdin_open: true
    privileged: true
    environment:
      PLATFORM:
      LFS_PHASE: scratch
    volumes:
      - type: bind
        source: lfs
        target: /mnt/lfs/lfs
      - type: bind
        source: lib
        target: /mnt/lfs/lib
      - type: bind
        source: package
        target: /mnt/lfs/package
      - type: bind
        source: $PWD/download
        target: /mnt/lfs/download
      - type: volume
        source: source
        target: /mnt/lfs/source
      - type: volume
        source: work
        target: /mnt/lfs/work
      - type: volume
        source: tools
        target: /mnt/lfs/tools
      - type: volume
        source: install
        target: /mnt/lfs/install

volumes:
  source:
  work:
  tools:
  install:
