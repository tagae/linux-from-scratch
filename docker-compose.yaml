services:
  bootstrap:
    build:
      dockerfile: Dockerfile.bootstrap
      args:
        HOST_UID: $HOST_UID
        HOST_GID: $HOST_GID
    tty: true
    stdin_open: true
    privileged: true
    environment:
      PLATFORM:
    volumes: &lfs-volumes
      - type: bind
        source: lfs
        target: /var/lfs/lfs
      - type: bind
        source: lib
        target: /var/lfs/lib
      - type: bind
        source: package
        target: /var/lfs/package
      - type: bind
        source: $PWD/download
        target: /var/lfs/download
      - type: bind
        source: $PWD/image
        target: /var/lfs/image
      - type: volume
        source: source
        target: /var/lfs/source
      - type: volume
        source: work
        target: /var/lfs/work
      - type: volume
        source: install
        target: /var/lfs/install
      - type: volume
        source: tools
        target: /var/lfs/tools

  scratch:
    build:
      dockerfile: Dockerfile.scratch
      args:
        HOST_UID: $HOST_UID
        HOST_GID: $HOST_GID
    tty: true
    stdin_open: true
    privileged: true
    environment:
      PLATFORM:
    volumes: *lfs-volumes

volumes:
  source:
  work:
  install:
  tools:
